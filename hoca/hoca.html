<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hồ cá vui nhộn</title>
    <link rel="stylesheet" href="/hoca/hoca.css" />
  </head>
  <body>
    <audio id="bgMusic" loop>
      <source
        src="/media/Nhạc không lời vui nhộn cho bé - Happy Music for Playtime - Playtime Music for Kids & Toddlers.mp3"
        type="audio/mpeg"
      />
    </audio>
    <button id="musicBtn">🔊 Bật nhạc</button>

    <div class="aquarium">
      <div class="sand"></div>
      <div class="rock rock1"></div>
      <div class="rock rock2"></div>
      <div class="plant plant1"></div>
      <div class="plant plant2"></div>
      <div class="plant plant3"></div>
      <div class="plant plant4"></div>
      <div class="plant plant5"></div>
      <div class="plant plant6"></div>
      <div class="treasure">
        <img src="/hoca/aquarium/khobau.png" width="200px" height="200px" />
      </div>
    </div>
    <div class="shark">
      <img src="/hoca/aquarium/shark.png" width="200px" height="200px" />
    </div>
    <div class="turtle">
      <img src="/hoca/aquarium/turtle.png" width="100px" height="100px" />
    </div>
    <div class="fish">
      <img src="/hoca/aquarium/goldFishSchool.png" width="75px" height="50px" />
    </div>
    <div class="human1">
      <img src="/hoca/aquarium/diver1.png" width="150px" height="100px" />
      <div class="bubble b1"></div>
      <div class="bubble b2"></div>
      <div class="bubble b3"></div>
    </div>
    <div class="human2">
      <img src="/hoca/aquarium/diver2.png" width="150px" height="100px" />
      <div class="bubble b1"></div>
      <div class="bubble b2"></div>
      <div class="bubble b3"></div>
    </div>
    <script src="/hoca/hoca.js"></script>
    <div class="light"></div>
  </body>
</html>
